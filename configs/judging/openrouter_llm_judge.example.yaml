judge:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: anthropic/claude-sonnet-4
  temperature: 0.0
  max_tokens: 8192
  timeout_seconds: 180
  max_retries: 3
  retry_backoff_seconds: 5
  concurrency: 1
  request_usage: true
  site_url_env: OPENROUTER_SITE_URL
  app_title: SGHA-LLM-Judge

evaluation:
  scoring_mode: formulation_only_10pt
  blind_methods: true
  use_blinding_key_during_scoring: false
  score_scale_min: 0
  score_scale_max: 10
  require_confidence: true
  require_rationale: true
  require_strengths: true
  require_weaknesses: true
  no_weighted_composite: true
  use_calibration_sentinels: true
  enforce_cap_rules: true
