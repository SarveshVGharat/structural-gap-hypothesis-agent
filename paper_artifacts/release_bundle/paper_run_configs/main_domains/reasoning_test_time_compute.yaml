# Sanitized public config approximating the paper run for Reasoning / test-time compute.
# This file documents paper-run settings without private paths or raw paper text.
run:
  name: "paper_reasoning_test_time_compute"
  domain: "reasoning_models_test_time_compute"
  source_type: "OpenReview"
  selected_paper_budget: 250
  output_root: "./outputs/paper_runs/reasoning_test_time_compute"

corpus:
  source_query_summary: "Topic-keyword retrieval for Reasoning / test-time compute papers. User must provide or retrieve papers independently."
  topic_keywords:
    - "reasoning models"
    - "test-time compute"
    - "self-improvement"
    - "verification"
    - "bootstrapping"
  papers_manifest: "./data/reasoning_test_time_compute/papers.jsonl"
  raw_pdfs_included: false
  parsed_full_texts_included: false

model:
  provider: "openai_compatible"
  base_url_env: "SGHA_LLM_BASE_URL"
  model_env: "SGHA_LLM_MODEL"
  default_model_name: "Qwen/Qwen3.5-9B"
  api_key_env: "SGHA_LLM_API_KEY"

stages:
  - "parse_or_load_existing_text"
  - "extract_structural_tuples"
  - "build_evidence_graph"
  - "mine_candidate_gaps"
  - "verify_gaps"
  - "stage7_direct_formulations"
  - "stage8_ambition_expansion"
  - "stage9_family_quality"
  - "stage10_formal_problem_formulations"
  - "final_sgha_family_report"

verification_gate:
  require_source_grounding: true
  require_specific_failure_or_assumption: true
  require_non_incremental_problem_framing: true
  keep_verification_passed_only_for_stage7: true

release_notes:
  sanitized_config: true
  private_paths_removed: true
  raw_papers_and_full_text_excluded: true
  use_existing_bundle_for_paper_values: "paper_artifacts/release_bundle/main_results/"
