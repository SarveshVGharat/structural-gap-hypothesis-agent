# Sanitized public config for the AI-Scientist-v2 + Claude Opus baseline.
baseline:
  name: "ai_scientist_v2_claude_opus"
  upstream_dependency: "AI-Scientist-v2 (user-managed external dependency)"
  model_requested: "~anthropic/claude-opus-latest"
  resolved_model_observed_in_artifacts: "anthropic/claude-opus-5 observed"
  inference_mode: "idea_generation_only"
  output_count_per_domain: "matched to SGHA final-family count"
  generated_code_execution: false
  training_or_finetuning: false
  output_root: "./outputs/baselines/ai_scientist_v2_claude_opus"

authentication:
  provider: "OpenRouter or user-provided compatible API"
  api_key_env: "OPENROUTER_API_KEY"
  api_key_included: false

release_notes:
  private_paths_removed: true
  raw_prompts_and_responses_included: false
  inspect_existing_outputs: "paper_artifacts/release_bundle/baselines/ai_scientist_v2_claude_opus/"
